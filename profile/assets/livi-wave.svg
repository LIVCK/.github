<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 250" class="livi-svg sk-solid st-operational pose-wave" role="img" aria-label="LIVI waves - all systems operational">
<style>
svg{overflow:visible}

.livi-svg{--body:#00E091;--detail:#0F192A;--signal:#00E091}
.livi-svg.sk-signal{--body:#F2F5F4;--detail:#0F192A}
body.light-stage .livi-svg.sk-signal{--body:#0F192A;--detail:#F2F5F4}
.livi-svg.sk-mono{--body:#F2F5F4;--detail:#0F192A}
body.light-stage .livi-svg.sk-mono{--body:#0F192A;--detail:#F2F5F4}

.st-operational{--signal:#00E091}
.st-degraded{--signal:#FFC53D}
.st-partial{--signal:#FF9040}
.st-major{--signal:#FF5C5C}
.st-maintenance{--signal:#5B9BFF}
.sk-solid.st-operational{--body:#00E091}
.sk-solid.st-degraded{--body:#FFC53D}
.sk-solid.st-partial{--body:#FF9040}
.sk-solid.st-major{--body:#FF5C5C}
.sk-solid.st-maintenance{--body:#5B9BFF}
.sk-mono{--signal:var(--body)}

.bfill{fill:var(--body)}
.dfill{fill:var(--detail)}
.sfill{fill:var(--signal)}
.bstroke{stroke:var(--body)}
.dstroke{stroke:var(--detail);stroke-linecap:round}

/* Gesichter */
.face{opacity:0}
.st-operational .f-ok{opacity:1}
.st-degraded    .f-alert{opacity:1}
.st-partial     .f-worry{opacity:1}
.st-major       .f-worry{opacity:1}
.st-maintenance .f-busy{opacity:1}
.pose-sleep .face{opacity:0}
.pose-sleep .f-sleep{opacity:1}
.pose-cheer .face{opacity:0}
.pose-cheer .f-happy{opacity:1}
.pose-wave  .face{opacity:0}
.pose-wave  .f-happy{opacity:1}
.pose-focus .face{opacity:0}
.pose-focus .f-focus{opacity:1}

/* Blinzeln — innere Ebene, damit Zwinkern darüber liegen kann */
.blink{transform-box:fill-box;transform-origin:center}
.wink{transform-box:fill-box;transform-origin:center}
.livi-svg .blink{animation:blink 5.2s infinite}
@keyframes blink{0%,95.5%,100%{transform:scaleY(1)}97.4%{transform:scaleY(.08)}}
.pose-sleep .blink{animation:none}

/* Anker */
.livi-svg{perspective:900px}
.spin{transform-box:view-box;transform-origin:150px 228px;transform-style:preserve-3d}
.livi{transform-box:view-box;transform-origin:150px 228px}
.eyes{transform-box:view-box;transform-origin:150px 150px}

/* Statuswechsel: einmal um die eigene Achse */
.livi-spin .spin{animation:spinTurn .78s cubic-bezier(.42,0,.3,1) 1}
@keyframes spinTurn{
  0%  {transform:rotateY(0deg)   translateY(0)     scale(1)}
  12% {transform:rotateY(24deg)  translateY(2px)   scale(1.04,.96)}
  32% {transform:rotateY(150deg) translateY(-20px) scale(.97,1.04)}
  50% {transform:rotateY(180deg) translateY(-24px) scale(1)}
  72% {transform:rotateY(320deg) translateY(-12px) scale(1)}
  88% {transform:rotateY(356deg) translateY(0)     scale(1.05,.95)}
  100%{transform:rotateY(360deg) translateY(0)     scale(1)}
}
.l-body{transform-box:fill-box;transform-origin:center bottom}
.l-ant{transform-box:view-box;transform-origin:150px 110px}
.l-lamp{transform-box:fill-box;transform-origin:center}
.l-halo{transform-box:fill-box;transform-origin:center;opacity:.18}
.l-leg,.l-arm{transform-box:fill-box;transform-origin:top center}
.zzz{opacity:0}
.ground{stroke-dasharray:14 12;stroke-linecap:round;opacity:.32}

.livi-svg .l-lamp{animation:lampPulse 2.4s ease-in-out infinite}
@keyframes lampPulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.13);opacity:.86}}
.livi-svg .l-halo{animation:haloPulse 2.4s ease-in-out infinite}
@keyframes haloPulse{0%,100%{transform:scale(1);opacity:.14}50%{transform:scale(1.5);opacity:.32}}

/* POSE · idle */
.pose-idle .l-body,.pose-focus .l-body{animation:breathe 3.6s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:scale(1,1)}50%{transform:scale(1.015,.985)}}
.pose-idle .l-ant,.pose-focus .l-ant{animation:antSway 3.6s ease-in-out infinite}
@keyframes antSway{0%,100%{transform:rotate(-3.5deg)}50%{transform:rotate(3.5deg)}}

/* POSE · walk */
.pose-walk .livi{animation:bob .62s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-1.2deg)}50%{transform:translateY(-7px) rotate(1.2deg)}}
.pose-walk .l-ant{animation:antRun .62s ease-in-out infinite}
@keyframes antRun{0%{transform:rotate(11deg)}40%{transform:rotate(-13deg)}100%{transform:rotate(11deg)}}
.pose-walk .l-leg-l{animation:swA .62s ease-in-out infinite}
.pose-walk .l-leg-r{animation:swB .62s ease-in-out infinite}
.pose-walk .l-arm-l{animation:armA .62s ease-in-out infinite}
.pose-walk .l-arm-r{animation:armB .62s ease-in-out infinite}
.pose-walk .ground{animation:gscroll .9s linear infinite}
@keyframes gscroll{to{stroke-dashoffset:-52}}
@keyframes swA{0%,100%{transform:rotate(19deg)}50%{transform:rotate(-19deg)}}
@keyframes swB{0%,100%{transform:rotate(-19deg)}50%{transform:rotate(19deg)}}
@keyframes armA{0%,100%{transform:rotate(-24deg)}50%{transform:rotate(20deg)}}
@keyframes armB{0%,100%{transform:rotate(20deg)}50%{transform:rotate(-24deg)}}

/* POSE · wave */
.pose-wave .l-body{animation:breathe 3.2s ease-in-out infinite}
.pose-wave .l-arm-r{animation:waveArm 1.1s ease-in-out infinite}
@keyframes waveArm{0%,100%{transform:rotate(-118deg)}50%{transform:rotate(-152deg)}}
.pose-wave .l-ant{animation:antSway 3.2s ease-in-out infinite}

/* POSE · point */
.pose-point .l-arm-r{transform:rotate(-92deg)}
.pose-point .l-body{animation:breathe 3.6s ease-in-out infinite}
.pose-point .l-ant{animation:antLean 3.6s ease-in-out infinite}
@keyframes antLean{0%,100%{transform:rotate(6deg)}50%{transform:rotate(12deg)}}

/* POSE · cheer */
.pose-cheer .livi{animation:hop .74s cubic-bezier(.4,0,.6,1) infinite}
@keyframes hop{0%,100%{transform:translateY(0)}45%{transform:translateY(-18px)}}
.pose-cheer .l-arm-l{transform:rotate(152deg)}
.pose-cheer .l-arm-r{transform:rotate(-152deg)}
.pose-cheer .l-ant{animation:antCheer .74s ease-in-out infinite}
@keyframes antCheer{0%{transform:rotate(-14deg)}50%{transform:rotate(14deg)}100%{transform:rotate(-14deg)}}

/* POSE · sleep */
.pose-sleep .livi{transform:rotate(-3deg)}
.pose-sleep .l-body{animation:sleepBreathe 4.6s ease-in-out infinite}
@keyframes sleepBreathe{0%,100%{transform:scale(1,1)}50%{transform:scale(1.035,.965)}}
.pose-sleep .l-ant{animation:antDroop 4.6s ease-in-out infinite}
@keyframes antDroop{0%,100%{transform:rotate(19deg)}50%{transform:rotate(24deg)}}
.pose-sleep .zzz{opacity:1}
.pose-sleep .l-lamp{animation:lampDim 4.6s ease-in-out infinite}
@keyframes lampDim{0%,100%{opacity:.4;transform:scale(.86)}50%{opacity:.75;transform:scale(.94)}}
.pose-sleep .l-halo{animation:none;opacity:.06}
.z1,.z2,.z3{transform-box:fill-box;transform-origin:center}
.pose-sleep .z1{animation:zfloat 3.2s ease-out infinite}
.pose-sleep .z2{animation:zfloat 3.2s ease-out .9s infinite}
.pose-sleep .z3{animation:zfloat 3.2s ease-out 1.8s infinite}
@keyframes zfloat{0%{opacity:0;transform:translate(0,6px) scale(.7)}
  25%{opacity:.9}100%{opacity:0;transform:translate(16px,-30px) scale(1.15)}}

/* POSE · alert */
.pose-alert .l-ant{animation:antAlert .62s ease-out infinite}
@keyframes antAlert{0%,100%{transform:rotate(-2deg)}28%{transform:rotate(-11deg)}60%{transform:rotate(5deg)}}
.pose-alert .l-body{animation:breathe 1.7s ease-in-out infinite}

/* POSE · scan — Antenne streicht, Blick geht mit */
.pose-scan .l-ant{animation:antScan 3.4s ease-in-out infinite}
@keyframes antScan{0%,100%{transform:rotate(-17deg)}50%{transform:rotate(17deg)}}
.pose-scan .l-body{animation:breathe 3.4s ease-in-out infinite}
.pose-scan .eyes{animation:lookScan 3.4s cubic-bezier(.7,0,.2,1) infinite}
@keyframes lookScan{
  0%,18%   {transform:translateX(-9px)}
  24%,44%  {transform:translateX(9px)}
  50%,58%  {transform:translateX(0)}
  64%,88%  {transform:translateX(-9px)}
  94%,100% {transform:translateX(-9px)}
}

/* POSE · sit — sitzt auf einer Kante, Beine baumeln */
.pose-sit .l-body{animation:breathe 3.8s ease-in-out infinite}
.pose-sit .l-ant{animation:antSway 3.8s ease-in-out infinite}
.pose-sit .l-leg-l{animation:dangleA 2.9s ease-in-out infinite}
.pose-sit .l-leg-r{animation:dangleB 2.9s ease-in-out infinite}
@keyframes dangleA{0%,100%{transform:rotate(11deg)}50%{transform:rotate(-5deg)}}
@keyframes dangleB{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(10deg)}}
.pose-sit .l-arm-l{transform:rotate(-16deg)}
.pose-sit .l-arm-r{transform:rotate(16deg)}

/* POSE · lean — lehnt sich an */
.pose-lean .livi{transform:rotate(6deg)}
.pose-lean .l-body{animation:breathe 3.8s ease-in-out infinite}
.pose-lean .l-ant{animation:antSway 3.8s ease-in-out infinite}
.pose-lean .l-arm-r{transform:rotate(-46deg)}
.pose-lean .l-arm-l{transform:rotate(9deg)}
.pose-lean .l-leg-l{transform:rotate(-11deg)}

/* Status-Overlay */
.st-major .livi{animation:shake .34s ease-in-out infinite}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
.st-major .l-ant{animation:antDroopMajor 2.1s ease-in-out infinite}
@keyframes antDroopMajor{0%,100%{transform:rotate(38deg)}50%{transform:rotate(44deg)}}
.st-degraded .l-lamp,.st-partial .l-lamp{animation:lampPulse 1.1s ease-in-out infinite}
.st-major .l-lamp{animation:lampPulse .62s ease-in-out infinite}

/* ---- LEBEN: greift NUR im grünen Zustand ---- */
.livi-life.st-operational .livi{animation:lifeBody 16s ease-in-out infinite}
.livi-life.st-operational .l-arm-r{animation:lifeWave 16s ease-in-out infinite}
.livi-life.st-operational .l-ant{animation:lifeAnt 16s ease-in-out infinite}
.livi-life.st-operational .wink-r{animation:lifeWink 16s ease-in-out infinite}
.livi-life.st-operational .wink-l{animation:lifeSquint 16s ease-in-out infinite}
@keyframes lifeWave{
  0%,3%{transform:rotate(0)}
  5.5%{transform:rotate(-142deg)}
  7.5%{transform:rotate(-112deg)}
  9.5%{transform:rotate(-146deg)}
  11.5%{transform:rotate(-115deg)}
  13.5%{transform:rotate(-140deg)}
  17%,100%{transform:rotate(0)}
}
@keyframes lifeBody{
  0%,30%{transform:translateY(0) rotate(0)}
  32%{transform:translateY(-17px) rotate(0)}
  34.5%{transform:translateY(0) rotate(0)}
  36%{transform:translateY(-7px) rotate(0)}
  38%,70.5%{transform:translateY(0) rotate(0)}
  73%{transform:translateY(0) rotate(4.5deg)}
  79%{transform:translateY(0) rotate(4.5deg)}
  82%,100%{transform:translateY(0) rotate(0)}
}
@keyframes lifeAnt{
  0%,3%{transform:rotate(-3deg)}
  6%{transform:rotate(-15deg)}
  12%{transform:rotate(-5deg)}
  18%{transform:rotate(-3deg)}
  25%{transform:rotate(2deg)}
  31%{transform:rotate(-4deg)}
  33%{transform:rotate(16deg)}
  36%{transform:rotate(-10deg)}
  40%{transform:rotate(-2deg)}
  52%{transform:rotate(3deg)}
  64%{transform:rotate(-3deg)}
  73%{transform:rotate(11deg)}
  80%{transform:rotate(8deg)}
  88%{transform:rotate(-3deg)}
  100%{transform:rotate(-3deg)}
}
@keyframes lifeWink{
  0%,48%{transform:scaleY(1)}
  49.6%{transform:scaleY(.08)}
  52%{transform:scaleY(.08)}
  53.6%,100%{transform:scaleY(1)}
}
@keyframes lifeSquint{
  0%,70.5%{transform:scaleY(1)}
  72.5%{transform:scaleY(.42)}
  79%{transform:scaleY(.42)}
  81.5%,100%{transform:scaleY(1)}
}

/* V-Marke — echter Logo-Pfad */
.v-mark{fill:var(--signal)}
.v-wipe{transform-box:fill-box;transform-origin:left center}
.v-anim .v-wipe{animation:vwipe 3.6s cubic-bezier(.55,0,.25,1) infinite}
@keyframes vwipe{0%{transform:scaleX(0)}30%{transform:scaleX(1)}100%{transform:scaleX(1)}}
.v-anim .v-hold{animation:vhold 3.6s linear infinite}
@keyframes vhold{0%,88%{opacity:1}97%,100%{opacity:0}}
.wordmark{font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif;font-weight:700;letter-spacing:-.02em;fill:var(--word,currentColor)}

@media (prefers-reduced-motion:reduce){*{animation-duration:.001ms!important;animation-iteration-count:1!important}}
</style>
<line class="ground bstroke" x1="30" y1="228" x2="270" y2="228" stroke-width="4"/>
  <g class="spin"><g class="livi">
    <g class="zzz">
      <text class="z1 sfill" x="196" y="86" font-family="-apple-system,Segoe UI,Roboto,sans-serif" font-size="17" font-weight="700">z</text>
      <text class="z2 sfill" x="208" y="70" font-family="-apple-system,Segoe UI,Roboto,sans-serif" font-size="21" font-weight="700">z</text>
      <text class="z3 sfill" x="222" y="52" font-family="-apple-system,Segoe UI,Roboto,sans-serif" font-size="26" font-weight="700">z</text>
    </g>
    <g class="l-ant">
      <path class="bstroke" fill="none" stroke-width="7" stroke-linecap="round" d="M150,110 C150,80 156,64 166,50"/>
      <circle class="l-halo sfill" cx="168" cy="44" r="21"/>
      <g class="l-lamp">
        <circle class="sfill" cx="168" cy="44" r="11.5"/>
        <circle cx="165.5" cy="41" r="4" fill="#fff" opacity=".45"/>
      </g>
    </g>
    <rect class="l-leg l-leg-l bfill" x="128" y="196" width="14" height="32" rx="7"/>
    <rect class="l-leg l-leg-r bfill" x="158" y="196" width="14" height="32" rx="7"/>
    <rect class="l-arm l-arm-l bfill" x="80"  y="158" width="12" height="32" rx="6"/>
    <rect class="l-arm l-arm-r bfill" x="208" y="158" width="12" height="32" rx="6"/>
    <g class="l-body">
      <path class="bfill" d="M150,96 C193,96 214,128 214,164 C214,192 187,206 150,206 C113,206 86,192 86,164 C86,128 107,96 150,96 Z"/>
      <g class="face f-ok">
        <g class="eyes">
          <g class="wink wink-l"><g class="blink"><ellipse class="dfill" cx="128" cy="150" rx="8" ry="10.5"/></g></g>
          <g class="wink wink-r"><g class="blink"><ellipse class="dfill" cx="172" cy="150" rx="8" ry="10.5"/></g></g>
        </g>
        <path class="dfill" d="M141,174 q9,8 18,0 q-9,4 -18,0 Z"/>
      </g>
      <g class="face f-alert">
        <g class="eyes">
          <ellipse class="dfill" cx="128" cy="146" rx="9.6" ry="12"/>
          <ellipse class="dfill" cx="172" cy="146" rx="9.6" ry="12"/>
        </g>
        <ellipse class="dfill" cx="150" cy="176" rx="7.5" ry="6"/>
      </g>
      <g class="face f-busy">
        <g class="eyes">
          <g class="wink"><g class="blink"><ellipse class="dfill" cx="128" cy="149" rx="9" ry="9.4"/></g></g>
          <g class="wink"><g class="blink"><ellipse class="dfill" cx="172" cy="149" rx="9" ry="9.4"/></g></g>
        </g>
        <ellipse class="dfill" cx="150" cy="177" rx="6.4" ry="5.6"/>
      </g>
      <g class="face f-worry">
        <g class="eyes">
          <line class="dstroke" x1="117" y1="156" x2="139" y2="144" stroke-width="8.5"/>
          <line class="dstroke" x1="183" y1="156" x2="161" y2="144" stroke-width="8.5"/>
        </g>
        <ellipse class="dfill" cx="150" cy="180" rx="9" ry="7"/>
      </g>
      <g class="face f-sleep">
        <g class="eyes">
          <path class="dstroke" fill="none" stroke-width="7" d="M119,148 q9,9 18,0"/>
          <path class="dstroke" fill="none" stroke-width="7" d="M163,148 q9,9 18,0"/>
        </g>
        <ellipse class="dfill" cx="150" cy="176" rx="5.5" ry="4.5"/>
      </g>
      <g class="face f-focus">
        <g class="eyes">
          <line class="dstroke" x1="119" y1="150" x2="137" y2="150" stroke-width="7.5"/>
          <line class="dstroke" x1="163" y1="150" x2="181" y2="150" stroke-width="7.5"/>
        </g>
        <line class="dstroke" x1="141" y1="176" x2="159" y2="176" stroke-width="6.5"/>
      </g>
      <g class="face f-happy">
        <g class="eyes">
          <path class="dstroke" fill="none" stroke-width="7" d="M119,152 q9,-11 18,0"/>
          <path class="dstroke" fill="none" stroke-width="7" d="M163,152 q9,-11 18,0"/>
        </g>
        <path class="dfill" d="M138,172 q12,14 24,0 q-12,7 -24,0 Z"/>
      </g>
    </g>
  </g></g>
</svg>
